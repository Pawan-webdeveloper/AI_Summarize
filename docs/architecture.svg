<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2fd7"/>
      <stop offset="0.52" stop-color="#3e78e8"/>
      <stop offset="1" stop-color="#8ed8f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a1050" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#101322"/>
    </marker>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <text x="600" y="72" text-anchor="middle" font-size="38" font-weight="700" fill="#ffffff">AI Web Scraper — Architecture</text>
  <text x="600" y="108" text-anchor="middle" font-size="19" fill="#dbe7ff">React + Vite client · Express backend · cheerio scraping · Groq AI</text>

  <!-- Client card -->
  <g filter="url(#shadow)">
    <rect x="60" y="160" width="480" height="420" rx="20" fill="#ffffff"/>
  </g>
  <rect x="60" y="160" width="480" height="54" rx="20" fill="#eef1ff"/>
  <rect x="60" y="192" width="480" height="22" fill="#eef1ff"/>
  <text x="300" y="195" text-anchor="middle" font-size="21" font-weight="700" fill="#101322">Browser — Vite Dev :5173</text>

  <text x="88" y="256" font-size="18" font-weight="700" fill="#2a2fd7">client/ · React 19 + TypeScript</text>
  <text x="88" y="290" font-size="16" fill="#374151">• URL input + Summarize button</text>
  <text x="88" y="318" font-size="16" fill="#374151">• States: idle / loading / success / error</text>
  <text x="88" y="346" font-size="16" fill="#374151">• Result card: title, source link, summary</text>
  <text x="88" y="374" font-size="16" fill="#374151">• fetch() → POST /api/summarize</text>

  <rect x="88" y="402" width="424" height="148" rx="12" fill="#f4f6fb" stroke="#d6dbe8"/>
  <text x="106" y="432" font-size="16" font-weight="700" fill="#101322">vite.config.ts</text>
  <text x="106" y="460" font-size="15" fill="#374151">server.proxy: '/api' → http://localhost:3000</text>
  <text x="106" y="488" font-size="15" fill="#374151">single origin in dev — no CORS setup needed</text>
  <text x="106" y="520" font-size="14" fill="#6b7280">npm run dev · npm run build (tsc + vite)</text>

  <!-- Server card -->
  <g filter="url(#shadow)">
    <rect x="660" y="160" width="480" height="420" rx="20" fill="#ffffff"/>
  </g>
  <rect x="660" y="160" width="480" height="54" rx="20" fill="#eef1ff"/>
  <rect x="660" y="192" width="480" height="22" fill="#eef1ff"/>
  <text x="900" y="195" text-anchor="middle" font-size="21" font-weight="700" fill="#101322">Node API — Express :3000</text>

  <text x="688" y="256" font-size="18" font-weight="700" fill="#2a2fd7">server/index.js (ESM)</text>
  <text x="688" y="290" font-size="16" fill="#374151">1. Validate URL — http(s) only, SSRF guard</text>
  <text x="688" y="318" font-size="16" fill="#374151">2. Scrape — fetch + cheerio text extraction</text>
  <text x="688" y="346" font-size="16" fill="#374151">3. Summarize — Groq chat completions</text>
  <text x="688" y="374" font-size="16" fill="#374151">4. Respond — { title, url, summary } JSON</text>

  <rect x="688" y="402" width="424" height="148" rx="12" fill="#f4f6fb" stroke="#d6dbe8"/>
  <text x="706" y="432" font-size="16" font-weight="700" fill="#101322">server/.env</text>
  <text x="706" y="460" font-size="15" font-family="ui-monospace, monospace" fill="#2a2fd7">GROQ_API_KEY · GROQ_MODEL · PORT</text>
  <text x="706" y="492" font-size="14" fill="#6b7280">model fallback chain on 429/503</text>
  <text x="706" y="520" font-size="14" fill="#6b7280">npm run server (from repo root)</text>

  <!-- client <-> server arrows -->
  <line x1="544" y1="300" x2="650" y2="300" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)"/>
  <text x="597" y="282" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">POST</text>
  <text x="597" y="326" text-anchor="middle" font-size="12.5" fill="#ffffff">/api/summarize</text>

  <line x1="650" y1="380" x2="548" y2="380" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)"/>
  <text x="599" y="362" text-anchor="middle" font-size="12.5" fill="#ffffff">{ title, url,</text>
  <text x="599" y="404" text-anchor="middle" font-size="12.5" fill="#ffffff">summary } · { error }</text>

  <!-- Target page card -->
  <g filter="url(#shadow)">
    <rect x="60" y="700" width="480" height="300" rx="20" fill="#101322"/>
  </g>
  <text x="300" y="748" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Target Web Page</text>
  <text x="300" y="784" text-anchor="middle" font-size="16" fill="#9fb3ff">any public HTML URL</text>
  <text x="300" y="818" text-anchor="middle" font-size="15" fill="#c9d4ff">GET with browser User-Agent · 15s timeout</text>
  <text x="300" y="846" text-anchor="middle" font-size="15" fill="#c9d4ff">redirects followed · 2 MB size cap</text>
  <text x="300" y="880" text-anchor="middle" font-size="15" fill="#c9d4ff">cheerio: strip script/nav/footer…</text>
  <text x="300" y="908" text-anchor="middle" font-size="15" fill="#c9d4ff">keep p / h1-h3 / li text → 15k chars</text>

  <!-- Groq card -->
  <g filter="url(#shadow)">
    <rect x="660" y="700" width="480" height="300" rx="20" fill="#101322"/>
  </g>
  <text x="900" y="748" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Groq AI API</text>
  <text x="900" y="784" text-anchor="middle" font-size="15" fill="#9fb3ff">api.groq.com/openai/v1/chat/completions</text>
  <text x="900" y="818" text-anchor="middle" font-size="15" fill="#c9d4ff">model: openai/gpt-oss-20b (free tier)</text>
  <text x="900" y="846" text-anchor="middle" font-size="15" fill="#c9d4ff">fallback: qwen3.8-27b · gpt-oss-120b</text>
  <text x="900" y="880" text-anchor="middle" font-size="15" fill="#c9d4ff">system prompt: 3–5 sentence paragraph</text>
  <text x="900" y="908" text-anchor="middle" font-size="15" fill="#c9d4ff">Bearer auth from server/.env — never in client</text>

  <!-- server -> external arrows -->
  <path d="M 760 584 C 700 640, 560 660, 400 696" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)"/>
  <text x="560" y="640" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">fetch HTML</text>

  <path d="M 900 588 L 900 692" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)"/>
  <text x="940" y="640" text-anchor="start" font-size="15" fill="#ffffff" font-weight="600">prompt → summary</text>

  <!-- Footer -->
  <text x="600" y="1070" text-anchor="middle" font-size="19" font-weight="700" fill="#101322">npm workspaces monorepo — client/ + server/</text>
  <text x="600" y="1104" text-anchor="middle" font-size="16" fill="#1b2559">npm install → npm run server + npm run dev → open http://localhost:5173</text>
  <text x="600" y="1136" text-anchor="middle" font-size="16" fill="#1b2559">flow: paste URL → scrape → Groq summary → render result card</text>
</svg>
